version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL - Banco de Dados
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: rpa_postgres
    environment:
      POSTGRES_USER: rpa_user
      POSTGRES_PASSWORD: rpa_password
      POSTGRES_DB: rpa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa_user -d rpa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # RabbitMQ - Message Broker
  # ----------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rpa_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rpa_user
      RABBITMQ_DEFAULT_PASS: rpa_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: