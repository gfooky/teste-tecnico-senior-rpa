services:
  # ----------------------------------------
  # API - FastAPI
  # ----------------------------------------
  api:
    build: .
    container_name: rpa_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rpa_user:rpa_password@db:5432/rpa_db
      - RABBITMQ_URL=amqp://rpa_user:rpa_password@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ----------------------------------------
  # Worker - Consumidor RabbitMQ
  # ----------------------------------------
  worker:
    build: .
    container_name: rpa_worker
    command: python -m app.worker.consumer
    environment:
      - DATABASE_URL=postgresql://rpa_user:rpa_password@db:5432/rpa_db
      - RABBITMQ_URL=amqp://rpa_user:rpa_password@rabbitmq:5672/
      - SELENIUM_URL=http://selenium:4444/wd/hub
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      selenium:
        condition: service_started

  # ----------------------------------------
  # PostgreSQL - Banco de Dados
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: rpa_postgres
    environment:
      POSTGRES_USER: rpa_user
      POSTGRES_PASSWORD: rpa_password
      POSTGRES_DB: rpa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa_user -d rpa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # RabbitMQ - Message Broker
  # ----------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rpa_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rpa_user
      RABBITMQ_DEFAULT_PASS: rpa_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Selenium - Navegador Headless
  # ----------------------------------------
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: rpa_selenium
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"

volumes:
  postgres_data:
  rabbitmq_data: